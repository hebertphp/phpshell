# Ambiente leve para as aulas: PHP + MySQL + phpMyAdmin (SQLite e driver do PostgreSQL já vão no PHP).
services:
  # 1. Servidor web + PHP (drivers: MySQL, SQLite e PostgreSQL)
  web:
    build: .
    container_name: aula_php_web
    ports:
      - "8080:80"
    volumes:
      - ./src:/var/www/html
    environment:
      PHP_CLI_SERVER_WORKERS: 4   # atende mais de uma requisição ao mesmo tempo
    # umask 000: arquivos criados pelo PHP (ex.: database.sqlite) podem ser editados e apagados por você
    command: sh -c "umask 000 && exec php -S 0.0.0.0:80 -t /var/www/html"
    depends_on:
      mysql_db:
        condition: service_healthy
    restart: unless-stopped

  # 2. Banco de dados MySQL (ajustado para gastar pouca memória)
  mysql_db:
    image: mysql:8.0
    container_name: aula_mysql_db
    command: --performance-schema=OFF --innodb-buffer-pool-size=64M --max-connections=30
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: meubanco_mysql
      MYSQL_USER: aluno
      MYSQL_PASSWORD: alunopassword
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-prootpassword", "--silent"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 15s
    restart: unless-stopped

  # 3. phpMyAdmin (interface para o MySQL)
  phpmyadmin:
    image: phpmyadmin:5-apache
    container_name: aula_phpmyadmin
    ports:
      - "8081:80"
    environment:
      PMA_HOST: mysql_db
    depends_on:
      mysql_db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  mysql_data:
