services:
  # 1. Servidor Web + PHP
  web:
    build: .
    container_name: aula_php_web
    ports:
      - "8080:80"
    volumes:
      - ./src:/var/www/html
    command: >
      sh -c "chmod -R 777 /var/www/html && apache2-foreground"
    restart: always

  # 2. Banco de Dados MySQL
  mysql_db:
    image: mysql:8.0
    container_name: aula_mysql_db
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: meubanco_mysql
      MYSQL_USER: aluno
      MYSQL_PASSWORD: alunopassword
    volumes:
      - mysql_data:/var/lib/mysql
    restart: always

  # 3. Banco de Dados PostgreSQL
  postgres_db:
    image: postgres:15
    container_name: aula_postgres_db
    environment:
      POSTGRES_DB: meubanco_postgres
      POSTGRES_USER: aluno
      POSTGRES_PASSWORD: alunopassword
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: always

  # 4. phpMyAdmin (Interface para MySQL)
  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: aula_phpmyadmin
    ports:
      - "8081:80"
    environment:
      PMA_HOST: mysql_db
      MYSQL_ROOT_PASSWORD: rootpassword
    restart: always

  # 5. pgAdmin (Interface dedicada para PostgreSQL)
  pgadmin:
    image: dpage/pgadmin4
    container_name: aula_pgadmin
    ports:
      - "8083:80"
    environment:
      PGADMIN_DEFAULT_EMAIL: aluno@aula.com
      PGADMIN_DEFAULT_PASSWORD: alunopassword
    restart: always

  # 6. SQLite Web (Interface dedicada para SQLite)
  sqliteweb:
    image: coleifer/sqlite-web
    container_name: aula_sqliteweb
    ports:
      - "8084:8080"
    volumes:
      - ./src:/db
    environment:
      SQLITE_DATABASE: database.sqlite
    restart: always

  # 7. Adminer (Gerenciador Universal)
  adminer:
    image: dockette/adminer
    container_name: aula_adminer
    ports:
      - "8082:80"
    restart: always

volumes:
  mysql_data:
  postgres_data:
